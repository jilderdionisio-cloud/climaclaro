<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ClimaClaro: consulta el clima actual de cualquier ciudad." />
    <title>ClimaClaro | Tu clima, sin rodeos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="ClimaClaro, inicio"><span>☀</span> ClimaClaro</a>
        <p>Tu clima, sin rodeos.</p>
      </header>

      <section class="hero" aria-labelledby="welcome-title">
        <p class="eyebrow">Pronóstico al instante</p>
        <h1 id="welcome-title">¿Cómo está el cielo hoy?</h1>
        <p class="intro">Busca una ciudad y descubre las condiciones actuales con información clara y útil.</p>
        <form id="weather-form" class="search-form">
          <label class="sr-only" for="city-input">Ciudad</label>
          <input id="city-input" name="city" type="search" placeholder="Ej. Ciudad de México" autocomplete="off" required />
          <button type="submit">Consultar clima <span aria-hidden="true">→</span></button>
        </form>
        <button id="location-button" class="location-button" type="button">⌖ Usar mi ubicación</button>
        <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
      </section>

      <section id="weather-card" class="weather-card" aria-live="polite" hidden>
        <div class="weather-main">
          <div>
            <p id="place-name" class="place-name"></p>
            <p id="weather-description" class="weather-description"></p>
            <p id="temperature" class="temperature"></p>
            <p id="feels-like" class="feels-like"></p>
          </div>
          <div id="weather-icon" class="weather-icon" aria-hidden="true">☀️</div>
        </div>
        <dl class="weather-details">
          <div><dt>Humedad</dt><dd id="humidity">—</dd></div>
          <div><dt>Viento</dt><dd id="wind">—</dd></div>
          <div><dt>Precipitación</dt><dd id="precipitation">—</dd></div>
        </dl>
      </section>
    </main>
    <footer>Datos meteorológicos por Open-Meteo</footer>
    <script src="app.js"></script>
  </body>
</html>
